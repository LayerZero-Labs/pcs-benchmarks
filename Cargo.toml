[workspace]
members = ["crates/pcs-bench-core", "crates/pcs-bench-runner", "benchmarks/akita"]
exclude = [
  "third_party/rokoko",
  "third_party/labrador",
  "third_party/greyhound-reference",
  "third_party/akita",
  "third_party/akita-pr466",
  "benchmarks/akita-pr466",
  "benchmarks/whir",
  "benchmarks/basefold",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/mtbadakhshan/akita-benchmark"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
uninlined_format_args = "allow"


[profile.bench]
debug = 1
lto = "thin"
codegen-units = 1

