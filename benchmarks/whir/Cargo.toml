# Isolated WHIR worker: Plonky3 git pin, not part of the lattice workspace.
[workspace]

[package]
name = "pcs-bench-whir"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/LayerZero-Labs/pcs-benchmarks"
publish = false
description = "Plonky3 p3-whir adapter for the hash PCS comparison"

[[bin]]
name = "hash-eval"
path = "src/bin/hash_eval.rs"

[dependencies]
pcs-bench-core = { path = "../../crates/pcs-bench-core" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc", "use-std"] }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3", rev = "9d496524560f3c699473906c6f50fca7cf343730" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3", rev = "9d496524560f3c699473906c6f50fca7cf343730" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3", rev = "9d496524560f3c699473906c6f50fca7cf343730" }
p3-field = { git = "https://github.com/Plonky3/Plonky3", rev = "9d496524560f3c699473906c6f50fca7cf343730" }
p3-koala-bear = { git = "https://github.com/Plonky3/Plonky3", rev = "9d496524560f3c699473906c6f50fca7cf343730" }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3", rev = "9d496524560f3c699473906c6f50fca7cf343730", features = ["parallel"] }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3", rev = "9d496524560f3c699473906c6f50fca7cf343730" }
p3-sumcheck = { git = "https://github.com/Plonky3/Plonky3", rev = "9d496524560f3c699473906c6f50fca7cf343730" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3", rev = "9d496524560f3c699473906c6f50fca7cf343730" }
p3-whir = { git = "https://github.com/Plonky3/Plonky3", rev = "9d496524560f3c699473906c6f50fca7cf343730", features = ["parallel"] }
rand = { version = "0.10.1", features = ["std", "std_rng"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
