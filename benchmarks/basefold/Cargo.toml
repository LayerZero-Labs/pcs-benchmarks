# Isolated BaseFold worker: SP1 SLOP git pin, not part of the lattice workspace.
[workspace]

[package]
name = "pcs-bench-basefold"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/LayerZero-Labs/pcs-benchmarks"
publish = false
description = "SP1 SLOP stacked BaseFold adapter for the hash PCS comparison"

[[bin]]
name = "hash-eval"
path = "src/bin/hash_eval.rs"

[dependencies]
bincode = "1.3"
pcs-bench-core = { path = "../../crates/pcs-bench-core" }
rand = "0.8"
rayon = "1.10"
serde_json = "1.0"
slop-algebra = { git = "https://github.com/succinctlabs/sp1", rev = "0f2a1e1389747ac0dbee1c4d40243eed20baba86" }
slop-basefold = { git = "https://github.com/succinctlabs/sp1", rev = "0f2a1e1389747ac0dbee1c4d40243eed20baba86" }
slop-basefold-prover = { git = "https://github.com/succinctlabs/sp1", rev = "0f2a1e1389747ac0dbee1c4d40243eed20baba86" }
slop-challenger = { git = "https://github.com/succinctlabs/sp1", rev = "0f2a1e1389747ac0dbee1c4d40243eed20baba86" }
slop-commit = { git = "https://github.com/succinctlabs/sp1", rev = "0f2a1e1389747ac0dbee1c4d40243eed20baba86" }
slop-koala-bear = { git = "https://github.com/succinctlabs/sp1", rev = "0f2a1e1389747ac0dbee1c4d40243eed20baba86" }
slop-merkle-tree = { git = "https://github.com/succinctlabs/sp1", rev = "0f2a1e1389747ac0dbee1c4d40243eed20baba86" }
slop-multilinear = { git = "https://github.com/succinctlabs/sp1", rev = "0f2a1e1389747ac0dbee1c4d40243eed20baba86" }
slop-stacked = { git = "https://github.com/succinctlabs/sp1", rev = "0f2a1e1389747ac0dbee1c4d40243eed20baba86" }
