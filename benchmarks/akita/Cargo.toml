[workspace]

[package]
name = "pcs-bench-akita"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/LayerZero-Labs/pcs-benchmarks"
publish = false
description = "Akita adapter for the PCS benchmark suite"

[dependencies]
# Path to the pinned checkout after `./scripts/fetch-vendors.sh`. That script
# installs planner-generated fp32-dense rows for nv=22 and nv=24, plus
# fp64-dense (nv=21/23/25/27) and fp128-dense (nv=20/22) overlays when present.
akita-algebra = { path = "../../third_party/akita/crates/akita-algebra" }
akita-config = { path = "../../third_party/akita/crates/akita-config", features = ["schedules-fp32-dense-recursive"] }
akita-pcs = { path = "../../third_party/akita/crates/akita-pcs" }
akita-prover = { path = "../../third_party/akita/crates/akita-prover" }
akita-serialization = { path = "../../third_party/akita/crates/akita-serialization" }
akita-transcript = { path = "../../third_party/akita/crates/akita-transcript" }
akita-types = { path = "../../third_party/akita/crates/akita-types" }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "72dc6451628d8b1dd794147a1f1cc40be0d77963", default-features = false, features = ["asm", "solinas"] }
pcs-bench-core = { path = "../../crates/pcs-bench-core" }
rand = "0.8"
rayon = "1.10"
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "e2e"
harness = false

[[bin]]
name = "lattice-eval"
path = "src/bin/lattice_eval.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
uninlined_format_args = "allow"
