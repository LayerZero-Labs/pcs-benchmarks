# Isolated Plonky2 FRI worker.
[workspace]

[package]
name = "pcs-bench-plonky2-fri"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/LayerZero-Labs/pcs-benchmarks"
publish = false
description = "Plonky2 univariate FRI adapter for the hash PCS comparison"

[[bin]]
name = "hash-eval"
path = "src/bin/hash_eval.rs"

[dependencies]
bincode = "1.3"
anyhow = "1.0"
pcs-bench-core = { path = "../../crates/pcs-bench-core" }
plonky2 = { git = "https://github.com/elliottech/plonky2", rev = "e1c2d35450948b88fca6a7e69e2643c3ecad3caa", default-features = false, features = ["std", "parallel", "timing"] }
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
