# Isolated Flock Ligerito Fast worker.
[workspace]

[package]
name = "pcs-bench-flock-ligerito"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/LayerZero-Labs/pcs-benchmarks"
publish = false
description = "Flock Ligerito Fast adapter for the hash PCS comparison"

[[bin]]
name = "hash-eval"
path = "src/bin/hash_eval.rs"

[dependencies]
bincode = "1.3"
flock-core = { git = "https://github.com/succinctlabs/flock", rev = "43f0eee06d887d87ad25d72614cbc2b17fe91430" }
pcs-bench-core = { path = "../../crates/pcs-bench-core" }
rand = "0.8"
rayon = "1.10"
serde_json = "1.0"
